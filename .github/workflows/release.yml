name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., 1.0.0, v1.0.0). If empty, inferred from tag or defaults.'
        required: false
        default: ''
      dry_run:
        description: 'Dry Run (build only, do not publish GitHub Release)'
        type: boolean
        required: true
        default: false
      target_platform:
        description: 'Select platform to compile (or "all")'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - android
          - web
          - linux
          - windows
          - macos
          - ios

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'push' || 
       github.event.inputs.target_platform == 'all' || 
       github.event.inputs.target_platform == 'android')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Package Artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk froggy-android.apk
          cp build/app/outputs/bundle/release/app-release.aab froggy-android.aab

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: froggy-android-apk
          path: froggy-android.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: froggy-android-aab
          path: froggy-android.aab

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'push' || 
       github.event.inputs.target_platform == 'all' || 
       github.event.inputs.target_platform == 'web')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Package Web Artifact
        run: |
          cd build/web && zip -r ../../froggy-web.zip .

      - name: Upload Web Zip
        uses: actions/upload-artifact@v7
        with:
          name: froggy-web
          path: froggy-web.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'push' || 
       github.event.inputs.target_platform == 'all' || 
       github.event.inputs.target_platform == 'linux')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux Artifact
        run: |
          tar -czf froggy-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Tarball
        uses: actions/upload-artifact@v7
        with:
          name: froggy-linux
          path: froggy-linux-x64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: |
      always() &&
      (github.event_name == 'push' || 
       github.event.inputs.target_platform == 'all' || 
       github.event.inputs.target_platform == 'windows')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Package Windows Artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath froggy-windows-x64.zip

      - name: Upload Windows Zip
        uses: actions/upload-artifact@v7
        with:
          name: froggy-windows
          path: froggy-windows-x64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: |
      always() &&
      (github.event_name == 'push' || 
       github.event.inputs.target_platform == 'all' || 
       github.event.inputs.target_platform == 'macos')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS Desktop
        run: flutter build macos --release --no-codesign

      - name: Package macOS Artifact
        run: |
          cd build/macos/Build/Products/Release && zip -r ../../../../froggy-macos.zip froggy.app

      - name: Upload macOS Zip
        uses: actions/upload-artifact@v7
        with:
          name: froggy-macos
          path: froggy-macos.zip

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: |
      always() &&
      (github.event_name == 'push' || 
       github.event.inputs.target_platform == 'all' || 
       github.event.inputs.target_platform == 'ios')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package iOS Artifact
        run: |
          cd build/ios/iphoneos && zip -r ../../../froggy-ios.zip Runner.app

      - name: Upload iOS Zip
        uses: actions/upload-artifact@v7
        with:
          name: froggy-ios
          path: froggy-ios.zip

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-web
      - build-linux
      - build-windows
      - build-macos
      - build-ios
    if: |
      always() &&
      (github.event_name == 'push' || 
       (github.event_name == 'workflow_dispatch' && 
        github.event.inputs.dry_run != 'true' && 
        github.event.inputs.target_platform == 'all'))
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: froggy-android-apk

      - name: Download Android AAB
        uses: actions/download-artifact@v8
        with:
          name: froggy-android-aab

      - name: Download Web Zip
        uses: actions/download-artifact@v8
        with:
          name: froggy-web

      - name: Download Linux Tarball
        uses: actions/download-artifact@v8
        with:
          name: froggy-linux

      - name: Download Windows Zip
        uses: actions/download-artifact@v8
        with:
          name: froggy-windows

      - name: Download macOS Zip
        uses: actions/download-artifact@v8
        with:
          name: froggy-macos

      - name: Download iOS Zip
        uses: actions/download-artifact@v8
        with:
          name: froggy-ios

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name || format('v1.0.0-manual-{0}', github.run_number) }}
          name: Release ${{ github.event.inputs.version || github.ref_name || format('v1.0.0-manual-{0}', github.run_number) }}
          draft: false
          prerelease: false
          files: |
            froggy-android.apk
            froggy-android.aab
            froggy-web.zip
            froggy-linux-x64.tar.gz
            froggy-windows-x64.zip
            froggy-macos.zip
            froggy-ios.zip
